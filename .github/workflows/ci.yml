name: Web checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Validate production migration SQL
        env:
          DATABASE_URL: postgresql+psycopg://movie:movie@localhost:5432/movie_recommender
        run: alembic upgrade 0004_web_accounts:0005_profile_artifacts --sql
