services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: movie_recommender
      POSTGRES_USER: movie
      POSTGRES_PASSWORD: movie
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie -d movie_recommender"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

