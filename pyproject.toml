[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-movie-recommender"
version = "0.1.0"
description = "A measurable hybrid movie recommendation engine"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "google-auth>=2.35,<3",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.9,<1",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "sqlalchemy>=2.0,<3",
  "tenacity>=9,<10",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "ingestion", "recommendation", "ml"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
