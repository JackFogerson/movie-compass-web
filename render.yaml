services:
  - type: web
    name: movie-compass-web
    runtime: docker
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GOOGLE_AUTH_ENABLED
        value: "true"
      - key: PASSWORD_AUTH_ENABLED
        value: "false"
      - key: REGISTRATION_EMAIL_VERIFICATION
        value: "false"
      - key: WEB_SESSION_SECRET
        generateValue: true
      - key: WEB_COOKIE_SECURE
        value: "true"
      - key: WEB_AUTH_REQUIRED
        value: "true"
